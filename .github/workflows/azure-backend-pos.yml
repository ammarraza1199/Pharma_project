name: Deploy Backend POS to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/azure-backend-pos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: backend-pos
  NODE_VERSION: "22"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Verify backend build
        working-directory: backend
        run: test -f dist/index.js

      - name: Prepare production deployment package
        working-directory: backend
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R dist deploy/dist
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts = { start: 'node dist/index.js' };
          delete pkg.devDependencies;
          fs.writeFileSync('deploy/package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cd deploy
          npm install --omit=dev

      - name: Verify production deployment package
        working-directory: backend
        run: |
          test -f deploy/dist/index.js
          test -f deploy/package.json
          test -f deploy/node_modules/express/package.json

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: "./backend/deploy"

      - name: Health check
        run: |
          echo "Checking backend health..."
          curl --fail --show-error --silent --retry 10 --retry-delay 5 --max-time 20 \
            "https://backend-pos-b0hpb6aza2dwanh9.westus3-01.azurewebsites.net/api/health"
          echo
